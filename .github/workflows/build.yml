name: 안드로이드 앱 빌드

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: 서명 키 준비
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/hj.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/hj.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 비밀값이 없어 임시 키로 서명해요 (업데이트 설치가 안 될 수 있어요)"
          fi

      - name: APK 빌드
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hajujangbu.apk
          SUM=$(sha256sum hajujangbu.apk | cut -d" " -f1)
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest hajujangbu.apk \
            --title "하루장부 안드로이드 앱" \
            --notes "폰에서 hajujangbu.apk 를 내려받아 설치하세요. 빌드 #${{ github.run_number }}  SHA-256: $SUM"
